# Redraws the value-net training data progress graph from the shared
# Hugging Face dataset's progress.json and publishes it on the
# `datagen-progress` branch, which docs/contribute-compute.md embeds.
name: Training data progress graph

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "tools/datagen/progress_chart.py"
      - "tools/datagen/config.json"
      - ".github/workflows/datagen-progress.yml"

permissions:
  contents: write

concurrency:
  group: datagen-progress
  cancel-in-progress: true

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render graph
        run: python tools/datagen/progress_chart.py --out site
      - name: Publish to the datagen-progress branch
        run: |
          cd site
          cat > README.md <<'MD'
          # Value-net training data progress

          Generated automatically by `.github/workflows/datagen-progress.yml`
          from the dataset's `progress.json`. See
          [docs/contribute-compute.md](https://github.com/${{ github.repository }}/blob/master/docs/contribute-compute.md).

          ![Progress](progress.svg)

          [Contributors](contributors.md)
          MD
          git init -q -b datagen-progress
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Progress graph $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" datagen-progress
